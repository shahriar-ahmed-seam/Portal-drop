[package]
name = "portal-drop-desktop"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
dirs = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.32"
wry = "0.50"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
tray-icon = { version = "0.21.3", default-features = false }
