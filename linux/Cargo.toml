[package]
name = "portal-drop"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
if-addrs = "0.15"
mdns-sd = { version = "0.22", default-features = false }
qrcode = { version = "0.14", default-features = false }
rcgen = "0.14"
ring = "0.17"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[profile.release]
strip = "symbols"
